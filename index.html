<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2024 - 2025</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            position: relative;
        }

        /* 🫀 NATIVE MOBILE BACKGROUND HEART ENGINE */
        .heart-background {
            position: absolute;
            right: -10%; /* Shifted big to the right side */
            top: 50%;
            transform: translateY(-50%);
            font-size: 35vh; /* Massive background size */
            opacity: 0.12; /* Faint, moody background look */
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: softPulse 4s infinite ease-in-out;
        }

        @keyframes softPulse {
            0%, 100% { transform: translateY(-50%) scale(1); opacity: 0.10; }
            50% { transform: translateY(-50%) scale(1.04); opacity: 0.18; }
        }

        .container {
            max-width: 500px;
            z-index: 2;
            position: relative;
        }

        .bio-text {
            font-size: 1.15rem;
            line-height: 1.8;
            letter-spacing: 0.5px;
            font-weight: 300;
            color: #e0e0e0;
            margin-bottom: 30px;
        }

        /* 🌊 THE ESCAPING DOTS TEXT EFFECT */
        .dots {
            color: #ff2e44;
            animation: blink 2s infinite ease-in-out;
            letter-spacing: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; text-shadow: 0 0 8px #ff2e44; }
        }

        .music-text {
            font-size: 0.8rem;
            color: #8b0000;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <!-- Massive, Faint Beating Anatomical Background Organ -->
    <div class="heart-background">🫀</div>

    <div class="container">
        <!-- Your Statement with the Glowing Crimson Ellipsis -->
        <p class="bio-text">
            i was just silent because it was too heavy, the feelings i have for you weren't enough to be said with words, but with actions<span class="dots">...</span>
        </p>

        <!-- Clean, Lightweight Audio Identifier -->
        <div class="music-text">🎵 omar apollo — evergreen</div>
    </div>

</body>
</html>
